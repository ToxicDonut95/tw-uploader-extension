<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title data-i18n="extName">Toxic Donut Uploader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <h1 data-i18n="extName">Toxic Donut Uploader</h1>
    <label class="toggle-label">
      <input type="checkbox" id="auto-upload-toggle">
      <span data-i18n="autoUpload">Automatisch uploaden</span>
    </label>
  </header>

  <div id="message" class="message" hidden></div>

  <section class="section">
    <h2 data-i18n="accountsHeading">Accounts</h2>
    <div id="accounts-list"></div>
    <form id="add-account-form" class="add-form">
      <div class="form-row">
        <label for="server-select" data-i18n="serverLabel">Server</label>
        <select id="server-select"></select>
      </div>
      <div class="form-row">
        <label for="world-select" data-i18n="worldLabel">Wereld</label>
        <select id="world-select"></select>
      </div>
      <div class="form-row">
        <label for="player-input" data-i18n="playerNameLabel">Spelersnaam</label>
        <input type="text" id="player-input" autocomplete="off">
      </div>
      <button type="submit" class="primary-button" data-i18n="addAccountButton">Account toevoegen</button>
    </form>
  </section>

  <section class="section">
    <h2 data-i18n="recentUploadsHeading">Recente uploads</h2>
    <div id="log-list"></div>
  </section>

  <footer class="popup-footer">
    <a id="portal-link" href="https://portal.toxicdonut.dev" target="_blank" rel="noopener" data-i18n="portalLink">Open het Toxic Donut portaal</a>
  </footer>

  <script src="../shared/constants.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
