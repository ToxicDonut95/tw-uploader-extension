<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Toxic Donut Uploader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <h1>Toxic Donut Uploader</h1>
    <label class="toggle-label">
      <input type="checkbox" id="auto-upload-toggle">
      <span>Automatisch uploaden</span>
    </label>
  </header>

  <div id="message" class="message" hidden></div>

  <section class="section">
    <h2>Accounts</h2>
    <div id="accounts-list"></div>
    <form id="add-account-form" class="add-form">
      <div class="form-row">
        <label for="world-input">Wereld</label>
        <input type="text" id="world-input" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="player-input">Spelersnaam</label>
        <input type="text" id="player-input" autocomplete="off">
      </div>
      <button type="submit" class="primary-button">Account toevoegen</button>
    </form>
  </section>

  <section class="section">
    <h2>Recente uploads</h2>
    <div id="log-list"></div>
  </section>

  <script src="../shared/constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
